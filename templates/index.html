<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日期提醒系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="app-nav">
        <div class="container">
            <div class="nav-content">
                <div class="nav-brand"><i class="bi bi-calendar-heart"></i><span>日期提醒系统</span></div>
                <div class="nav-links">
                    <button class="btn-config" onclick="testWechat()"><i class="bi bi-wechat"></i> 测试企微</button>
                    <button class="btn-config" onclick="testFeishu()"><i class="bi bi-rocket"></i> 测试飞书</button>
                    <button class="btn-config" onclick="openConfigModal()"><i class="bi bi-gear"></i> 配置</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <!-- 监控概览 -->
        <div class="dashboard-grid">
            <div class="dash-card dash-card-red"><div class="dash-icon"><i class="bi bi-exclamation-triangle"></i></div><div class="dash-info"><div class="dash-value" id="todayDue">0</div><div class="dash-label">今日到期</div></div></div>
            <div class="dash-card dash-card-orange"><div class="dash-icon"><i class="bi bi-calendar-week"></i></div><div class="dash-info"><div class="dash-value" id="weekDue">0</div><div class="dash-label">本周到期</div></div></div>
            <div class="dash-card dash-card-blue"><div class="dash-icon"><i class="bi bi-calendar-month"></i></div><div class="dash-info"><div class="dash-value" id="monthDue">0</div><div class="dash-label">本月到期</div></div></div>
            <div class="dash-card dash-card-gray"><div class="dash-icon"><i class="bi bi-clock-history"></i></div><div class="dash-info"><div class="dash-value" id="overdue">0</div><div class="dash-label">已过期</div></div></div>
        </div>

        <div class="section">
            <h2 class="section-title"><i class="bi bi-folder2-open"></i> 项目概览</h2>
            <div class="project-stats-grid" id="projectStats"><p style="color:var(--text-secondary);text-align:center;padding:1rem;width:100%">暂无项目</p></div>
        </div>

        <div class="stats-bar">
            <div class="stat-item"><div class="stat-num" id="totalReminders">0</div><div class="stat-text">总提醒</div></div>
            <div class="stat-item"><div class="stat-num" id="activeReminders">0</div><div class="stat-text">活跃</div></div>
            <div class="stat-item"><div class="stat-num" id="totalLogs">0</div><div class="stat-text">已发送</div></div>
            <div class="stat-item"><div class="stat-num" id="successLogs">0</div><div class="stat-text">成功</div></div>
        </div>

        <div class="toolbar">
            <div class="search-box"><i class="bi bi-search"></i><input type="text" id="searchInput" placeholder="搜索提醒..."></div>
            <div class="toolbar-actions">
                <button class="btn-primary" onclick="openProjectModal()"><i class="bi bi-folder-plus"></i> 新建项目</button>
                <button class="btn-primary" onclick="openReminderModal()"><i class="bi bi-plus-lg"></i> 新建提醒</button>
            </div>
        </div>

        <div class="project-tabs" id="projectTabs"><button class="project-tab active" onclick="filterByProject('')">全部</button></div>
        <div id="reminderCards" class="cards-grid"><div class="empty-state"><i class="bi bi-calendar-x"></i><p>暂无提醒</p></div></div>
    </main>

    <!-- 配置弹窗 -->
    <div class="modal fade" id="configModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title"><i class="bi bi-gear"></i> 全局配置</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label"><i class="bi bi-wechat"></i> 企业微信 Webhook</label>
                        <input type="text" class="form-control" id="wechatWebhook" placeholder="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx">
                    </div>
                    <div class="form-group">
                        <label class="form-label"><i class="bi bi-rocket"></i> 飞书 Webhook</label>
                        <input type="text" class="form-control" id="feishuWebhook" placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/xxx">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-cancel" data-bs-dismiss="modal">取消</button>
                    <button class="btn-save" onclick="saveConfig()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 提醒弹窗 -->
    <div class="modal fade" id="reminderModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="reminderModalTitle"><i class="bi bi-plus-circle"></i> 新建提醒</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <ul class="nav nav-tabs mb-3" id="reminderTabs">
                        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#tabBasic">基本</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tabWebhook">通知渠道</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tabNote">备注/文档</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tabScript">脚本</a></li>
                    </ul>
                    <div class="tab-content">
                        <!-- 基本 -->
                        <div class="tab-pane fade show active" id="tabBasic">
                            <input type="hidden" id="reminderId">
                            <div class="form-row">
                                <div class="form-group flex-2"><label class="form-label">标题</label><input type="text" class="form-control" id="title" placeholder="提醒标题"></div>
                                <div class="form-group"><label class="form-label">所属项目</label><select class="form-control" id="projectId"><option value="">未分组</option></select></div>
                            </div>
                            <div class="form-group"><label class="form-label">目标日期</label><input type="date" class="form-control" id="targetDate"></div>
                            <div class="form-group"><label class="form-label">提前提醒天数</label><div class="options-grid"><label class="option-card"><input type="checkbox" value="1" class="reminder-day"><span>1天</span></label><label class="option-card"><input type="checkbox" value="3" class="reminder-day"><span>3天</span></label><label class="option-card"><input type="checkbox" value="7" class="reminder-day"><span>7天</span></label><label class="option-card"><input type="checkbox" value="15" class="reminder-day"><span>15天</span></label><label class="option-card"><input type="checkbox" value="30" class="reminder-day"><span>30天</span></label></div></div>
                            <div class="form-group"><label class="form-label">每天提醒时间</label><div class="options-grid"><label class="option-card"><input type="checkbox" value="09:00" class="reminder-time"><span>09:00</span></label><label class="option-card"><input type="checkbox" value="12:00" class="reminder-time"><span>12:00</span></label><label class="option-card"><input type="checkbox" value="14:00" class="reminder-time"><span>14:00</span></label><label class="option-card"><input type="checkbox" value="18:00" class="reminder-time"><span>18:00</span></label><label class="option-card"><input type="checkbox" value="21:00" class="reminder-time"><span>21:00</span></label></div></div>
                            <div class="form-group"><label class="form-label">@提醒人员</label><input type="text" class="form-control" id="mentionList" placeholder="手机号或userid，多个用逗号分隔"><small class="form-hint">支持手机号（11位）或企业微信userid</small></div>
                            <div class="form-group"><label class="switch-label"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="isActive" checked><label class="form-check-label" for="isActive">启用提醒</label></div></label></div>
                        </div>
                        <!-- 通知渠道 -->
                        <div class="tab-pane fade" id="tabWebhook">
                            <div class="form-group">
                                <label class="form-label">通知渠道</label>
                                <select class="form-control" id="webhookType">
                                    <option value="">使用全局默认（企业微信）</option>
                                    <option value="wechat">企业微信</option>
                                    <option value="feishu">飞书</option>
                                </select>
                                <small class="form-hint">不选择则使用全局配置的企业微信</small>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Webhook 地址（可选）</label>
                                <input type="text" class="form-control" id="webhookUrl" placeholder="不填则使用全局配置">
                                <small class="form-hint">单独配置该提醒的 webhook，不填则使用全局配置</small>
                            </div>
                        </div>
                        <!-- 备注/文档 -->
                        <div class="tab-pane fade" id="tabNote">
                            <div class="form-group">
                                <label class="form-label">备注（支持 Markdown）</label>
                                <textarea class="form-control" id="note" rows="6" placeholder="支持 Markdown 格式..."></textarea>
                            </div>
                            <div class="form-group">
                                <label class="form-label">文档</label>
                                <div id="documentsList"></div>
                                <button class="btn-sm btn-outline-primary mt-2" onclick="addDocument()"><i class="bi bi-plus"></i> 添加文档</button>
                            </div>
                        </div>
                        <!-- 脚本 -->
                        <div class="tab-pane fade" id="tabScript">
                            <div id="scriptsList"></div>
                            <button class="btn-sm btn-outline-primary mt-2" onclick="addScript()"><i class="bi bi-plus"></i> 添加脚本</button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-cancel" data-bs-dismiss="modal">取消</button>
                    <button class="btn-save" id="saveReminder">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 项目弹窗 -->
    <div class="modal fade" id="projectModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
            <div class="modal-header"><h5 class="modal-title"><i class="bi bi-folder-plus"></i> 新建项目</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="form-group"><label class="form-label">项目名称</label><input type="text" class="form-control" id="projectName" placeholder="例如：项目A"></div>
                <div class="form-group"><label class="form-label">颜色</label><div class="color-options"><label class="color-card"><input type="radio" name="projectColor" value="#6366f1" checked><span style="background:#6366f1"></span></label><label class="color-card"><input type="radio" name="projectColor" value="#8b5cf6"><span style="background:#8b5cf6"></span></label><label class="color-card"><input type="radio" name="projectColor" value="#ec4899"><span style="background:#ec4899"></span></label><label class="color-card"><input type="radio" name="projectColor" value="#f59e0b"><span style="background:#f59e0b"></span></label><label class="color-card"><input type="radio" name="projectColor" value="#10b981"><span style="background:#10b981"></span></label><label class="color-card"><input type="radio" name="projectColor" value="#3b82f6"><span style="background:#3b82f6"></span></label></div></div>
            </div>
            <div class="modal-footer"><button class="btn-cancel" data-bs-dismiss="modal">取消</button><button class="btn-save" onclick="saveProject()">保存</button></div>
        </div></div>
    </div>

    <!-- 日志弹窗 -->
    <div class="modal fade" id="logsModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content">
            <div class="modal-header"><h5 class="modal-title"><i class="bi bi-clock-history"></i> 发送日志</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body"><div id="logsList" class="logs-list"></div></div>
        </div></div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast"><div class="toast-body" id="toastBody"></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
